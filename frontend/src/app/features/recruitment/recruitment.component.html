<h2>Recruitment</h2>

<h3>Add Job</h3>
<input [(ngModel)]="jobForm.title" placeholder="Job Title" />
<input [(ngModel)]="jobForm.department" placeholder="Department" />
<input [(ngModel)]="jobForm.location" placeholder="Location" />
<input [(ngModel)]="jobForm.description" placeholder="Description" />
<button (click)="addJob()">Post Job</button>

<table border="1" cellpadding="6" style="width:100%; margin-top:10px; border-collapse: collapse;">
  <tr><th>Title</th><th>Dept</th><th>Location</th><th>Status</th></tr>
  <tr *ngFor="let j of jobs">
    <td>{{j.title}}</td><td>{{j.department}}</td><td>{{j.location}}</td><td>{{j.status}}</td>
  </tr>
</table>

<h3 style="margin-top:20px;">Add Applicant</h3>
<input [(ngModel)]="appForm.name" placeholder="Name" />
<input [(ngModel)]="appForm.email" placeholder="Email" />
<input [(ngModel)]="appForm.phone" placeholder="Phone" />
<select [(ngModel)]="appForm.jobId">
  <option value="">Select Job</option>
  <option *ngFor="let j of jobs" [value]="j.id">{{j.title}}</option>
</select>
<button (click)="addApplicant()">Add Applicant</button>

<h3>Applicants</h3>
<table border="1" cellpadding="6" style="width:100%; border-collapse: collapse;">
  <tr><th>Name</th><th>Email</th><th>Job</th><th>Status</th><th>Change</th></tr>
  <tr *ngFor="let a of applicants">
    <td>{{a.name}}</td><td>{{a.email}}</td><td>{{a.job?.title}}</td><td>{{a.status}}</td>
    <td>
      <select [value]="a.status" (change)="changeStatus(a.id, $any($event.target).value)">
        <option>APPLIED</option><option>SCREENING</option><option>INTERVIEW</option><option>OFFERED</option><option>HIRED</option><option>REJECTED</option>
      </select>
    </td>
  </tr>
</table>
