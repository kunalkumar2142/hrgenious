version: '3.8'
services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: hrgenius-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: HrGenius123
      APP_USER: hrgenius
      APP_USER_PASSWORD: HrGenius123
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Optional Oracle Enterprise Manager Express
  # Access: https://localhost:5500/em

volumes:
  oracle_data:
    driver: local
